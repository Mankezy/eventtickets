services:
  - type: web
    name: eventtickets
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SERVE_LOCAL_MEDIA
        value: "1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
